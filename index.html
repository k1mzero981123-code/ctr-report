${nm}`))return;try{drawList((await api("/api/accounts",{act:b.dataset.a,id:b.dataset.id})).list)}catch(x){alert(x.message)}})};$("#aadd").onclick=async()=>{$("#aerr").textContent="";try{drawList((await api("/api/accounts",{act:"add",id:$("#aid").value.trim(),name:$("#anm").value.trim()})).list);$("#aid").value=$("#anm").value=""}catch(x){$("#aerr").textContent=x.message}};try{drawList((await api("/api/accounts")).list)}catch(x){$("#alist").textContent=x.message}}function pwPop(force){$("#login").classList.add("hide");$("#app").classList.add("hide");$("#ptitle").textContent="비밀번호를 새로 정해 주세요";$("#pbody").innerHTML=`<label class="fld"><span>지금 비밀번호</span><input id="pc" type="password"></label><label class="fld"><span>새 비밀번호 (8자 이상 · 영문 + 숫자 + 특수문자)</span><input id="pn" type="password"></label><div class="err" id="perr"></div><button class="btn pri" id="pok">바꾸기</button>`;$("#pclose").classList.toggle("hide",!!force);$("#mask").classList.remove("hide");$("#pok").onclick=async()=>{try{await api("/api/password",{cur:$("#pc").value,nw:$("#pn").value});$("#mask").classList.add("hide");$("#pclose").classList.remove("hide");await load()}catch(x){$("#perr").textContent=x.message}}}load().catch(e=>{document.body.innerHTML=`<div style="padding:40px">불러오지 못했습니다: ${esc(e.message)}</div>`});</script>
