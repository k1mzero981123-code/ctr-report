${nm}`))return;try{drawList((await api("/api/accounts",{act:b.dataset.a,id:b.dataset.id})).list)}catch(x){alert(x.message)}})};$("#aadd").onclick=async()=>{$("#aerr").textContent="";try{drawList((await api("/api/accounts",{act:"add",id:$("#aid").value.trim(),name:$("#anm").value.trim()})).list);$("#aid").value=$("#anm").value=""}catch(x){$("#aerr").textContent=x.message}};try{drawList((await api("/api/accounts")).list)}catch(x){$("#alist").textContent=x.message}}function pwPop(force){$("#login").classList.add("hide");$("#app").classList.add("hide");$("#ptitle").textContent="비밀번호를 새로 정해 주세요";$("#pbody").innerHTML=`<label class="fld"><span>지금 비밀번호</span><input id="pc" type="password"></label><label class="fld"><span>새 비밀번호 (8자 이상 · 영문 + 숫자 + 특수문자)</span><input id="pn" type="password"></label><div class="err" id="perr"></div><button class="btn pri" id="pok">바꾸기</button>`;$("#pclose").classList.toggle("hide",!!force);$("#mask").classList.remove("hide");$("#pok").onclick=async()=>{try{await api("/api/password",{cur:$("#pc").value,nw:$("#pn").value});$("#mask").classList.add("hide");$("#pclose").classList.remove("hide");await load()}catch(x){$("#perr").textContent=x.message}}}const RC_TIP="원가 대비 = 매입 금액에 몇 %를 붙여 팔았나\n\n예) 매입 100원 → 매출 106원\n  → 6원 남음\n  → 원가 대비 6%  (매입 100원에 6원을 붙여 팜)\n\n※ 마진율은 매출(106원) 기준이라 5.66%로 조금 작게 나옵니다.";const MR_TIP="마진율 = 매출에서 몇 %가 남았나\n\n예) 매입 100원 → 매출 106원\n  → 6원 남음\n  → 마진율 5.66%  (매출 106원 중 6원 남김)\n\n※ 회사 보고에서 보통 쓰는 숫자입니다.";function mrTipFix(){document.querySelectorAll("th, td, small, .k, .s, div.kpi .v small, .note").forEach(el=>{if(el.dataset.rct||el.dataset.mrt||!/마진율/.test(el.textContent||"")||/원가 대비/.test(el.textContent||""))return;if([...el.children].some(c=>/마진율/.test(c.textContent||"")&&c.children.length<3&&c.tagName!=="BR"))return;if((el.textContent||"").trim().length>30)return;el.dataset.mrt=1;el.title=MR_TIP;el.style.cursor="help"})}function rcTipFix(){document.querySelectorAll("th, td, small, .k, .s, div.kpi .v2 small, .note").forEach(el=>{if(el.dataset.rct||!/원가 대비/.test(el.textContent||""))return;if([...el.children].some(c=>/원가 대비/.test(c.textContent||"")&&c.children.length<3&&c.tagName!=="BR"))return;el.dataset.rct=1;el.title=RC_TIP;el.style.cursor="help"})}new MutationObserver(()=>{clearTimeout(rcTipFix.t);rcTipFix.t=setTimeout(()=>{rcTipFix();mrTipFix()},50)}).observe(document.body,{childList:true,subtree:true});function mgHelp(){const k=S.m.kpi,pb=k.pb||0,mg=k.mgAll!=null?k.mgAll:k.mg,buy=k.cost-pb,E=v=>eok(v)+"억";const row=(a,b,c,d)=>`<tr><td>${a}</td><td>${b}</td><td>${c}</td><td><b>${d}</b></td></tr>`;$("#ptitle").textContent="🔍 마진율 · 원가 대비 — 왜 숫자가 다를까?";$("#pbody").innerHTML=`<div class="verdict" style="margin-bottom:14px">남긴 돈은 똑같고, <b>나누는 기준</b>만 다릅니다.<br>마진율 = <b>매출</b>로 나눔 · 원가 대비 = <b>매입</b>으로 나눔</div>

    <div><div class="ph2"><h3>우리 숫자 (${esc(S.m.per.from.slice(0,7))} ~ ${esc(S.m.per.to.slice(0,7))} · 페이백 포함)</h3></div>
      <table class="t"><thead><tr><th></th><th>무엇으로 나누나</th><th>계산</th><th>결과</th></tr></thead><tbody>
      ${row("마진율","매출 "+E(k.sales),E(mg)+" ÷ "+E(k.sales),pct(k.rateAll!=null?k.rateAll:k.rate))}${row("원가 대비","매입 "+E(buy),E(mg)+" ÷ "+E(buy),pct(k.rcAll!=null?k.rcAll:k.rc))}</tbody></table></div></div>
